<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t d">
  <title id="t">infra-shelf</title>
  <desc id="d">Three service units of different heights standing inside a shelf frame.</desc>

  <!-- The slab: same ink as the shelf on the site. Carrying its own dark tile
       keeps the mark legible on light and dark backgrounds alike. -->
  <rect width="64" height="64" rx="13" fill="#14161A"/>

  <!-- The frame. Without the uprights the mark reads as a bar chart, so they
       are what makes it a shelf. -->
  <g fill="#5B616B">
    <rect x="8" y="14" width="4" height="36" rx="1.5"/>
    <rect x="52" y="14" width="4" height="36" rx="1.5"/>
    <rect x="8" y="46" width="48" height="4" rx="1.5"/>
  </g>

  <!-- Units standing on the board. Colour identifies a service: postgres,
       rabbitmq, mongodb. -->
  <rect x="13" y="24" width="10" height="22" rx="1.5" fill="#4E85B8"/>
  <rect x="27" y="30" width="10" height="16" rx="1.5" fill="#E0813A"/>
  <rect x="41" y="20" width="10" height="26" rx="1.5" fill="#479A58"/>
</svg>
